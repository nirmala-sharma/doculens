<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuLens</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #212121;
            color: #ececec;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #2f2f2f;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: #4f46e5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ececec;
        }

        .upload-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2f2f2f;
            border: 1px solid #3f3f3f;
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.85rem;
            color: #ccc;
            position: relative;
        }

        .upload-pill:hover { background: #383838; }

        .upload-pill input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
        }

        .upload-pill svg { flex-shrink: 0; }

        .upload-status-badge {
            display: none;
            align-items: center;
            gap: 6px;
            background: #1a3a2a;
            border: 1px solid #2d6a4f;
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.8rem;
            color: #6fcf97;
        }

        .upload-status-badge.visible { display: flex; }

        /* ── Chat area ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 32px 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 3px; }

        /* Welcome screen */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 12px;
            padding: 60px 20px;
            text-align: center;
            color: #888;
        }

        .welcome-icon {
            width: 56px;
            height: 56px;
            background: #2f2f2f;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome h2 {
            font-size: 1.5rem;
            color: #ececec;
            font-weight: 600;
        }

        .welcome p {
            font-size: 0.95rem;
            max-width: 380px;
            line-height: 1.6;
        }

        .welcome-hints {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }

        .hint-chip {
            background: #2f2f2f;
            border: 1px solid #3f3f3f;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #bbb;
            cursor: pointer;
            transition: background 0.15s;
        }

        .hint-chip:hover { background: #383838; color: #ececec; }

        /* Message rows */
        .message-row {
            padding: 20px 0;
            width: 100%;
        }

        .message-row.user { background: transparent; }
        .message-row.assistant { background: #2a2a2a; }

        .message-inner {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .avatar.user { background: #4f46e5; color: white; }
        .avatar.assistant { background: #19c37d; color: #212121; font-size: 16px; }

        .message-content { flex: 1; }

        .message-text {
            line-height: 1.7;
            font-size: 0.95rem;
            color: #ececec;
        }

        .message-text.thinking {
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #888;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Sources */
        .sources-section {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sources-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #666;
            font-weight: 600;
        }

        .source-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #1e1e2e;
            border: 1px solid #3a3a5c;
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
        }

        .score-text {
            font-size: 0.75rem;
            color: #555;
            margin-top: 8px;
        }

        /* ── Input bar ── */
        .input-area {
            flex-shrink: 0;
            padding: 16px 24px 24px;
            background: #212121;
        }

        .input-wrapper {
            max-width: 680px;
            margin: 0 auto;
            background: #2f2f2f;
            border: 1px solid #3f3f3f;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within { border-color: #4f46e5; }

        .input-top {
            display: flex;
            align-items: flex-end;
            padding: 12px 16px 8px;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-size: 0.95rem;
            font-family: inherit;
            color: #ececec;
            line-height: 1.5;
            max-height: 160px;
            min-height: 24px;
        }

        textarea::placeholder { color: #666; }

        .send-btn {
            width: 34px;
            height: 34px;
            background: #4f46e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .send-btn:hover { background: #4338ca; }
        .send-btn:disabled { background: #3a3a3a; cursor: not-allowed; }

        .send-btn svg { color: white; }

        .input-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 16px 12px;
            gap: 10px;
        }

        .attach-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: 1px solid #3f3f3f;
            border-radius: 8px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.78rem;
            color: #999;
            transition: all 0.15s;
            position: relative;
        }

        .attach-btn:hover { background: #383838; color: #ccc; border-color: #555; }

        .attach-btn input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
        }

        .file-preview {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .file-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #1e2a3a;
            border: 1px solid #2d4a6a;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.75rem;
            color: #7eb8f7;
        }

        .file-chip .remove {
            cursor: pointer;
            color: #666;
            font-size: 12px;
            line-height: 1;
        }
        .file-chip .remove:hover { color: #ccc; }

        .hint-text {
            font-size: 0.72rem;
            color: #555;
        }

        .error-toast {
            display: none;
            max-width: 680px;
            margin: 0 auto 10px;
            background: #3a1a1a;
            border: 1px solid #6a2a2a;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #f87171;
        }

        .error-toast.visible { display: block; }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-left">
        <div class="logo">🔍</div>
        <h1>DocuLens</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
        <div class="upload-pill" id="headerUploadPill">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload PDF
            <input type="file" id="headerFileInput" accept=".pdf" multiple onchange="handleHeaderUpload(this)">
        </div>
        <div class="upload-status-badge" id="uploadBadge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="uploadBadgeText"></span>
        </div>
    </div>
</div>

<!-- Chat area -->
<div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
        <div class="welcome-icon">🔍</div>
        <h2>DocuLens</h2>
        <p>Upload a PDF and ask questions about it. Answers come with citations from your document.</p>
        <div class="welcome-hints">
            <div class="hint-chip" onclick="useHint(this)">What are the main topics?</div>
            <div class="hint-chip" onclick="useHint(this)">Summarize this document</div>
            <div class="hint-chip" onclick="useHint(this)">What are the key skills mentioned?</div>
            <div class="hint-chip" onclick="useHint(this)">List all projects</div>
        </div>
    </div>
</div>

<!-- Error toast -->
<div class="error-toast" id="errorToast"></div>

<!-- Input bar -->
<div class="input-area">
    <div class="input-wrapper">
        <div class="input-top">
            <textarea id="question" rows="1" placeholder="Ask anything about your document…" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="askQuestion()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
        </div>
        <div class="input-bottom">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <label class="attach-btn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    Attach PDF
                    <input type="file" id="attachFileInput" accept=".pdf" multiple onchange="handleAttachUpload(this)">
                </label>
                <div class="file-preview" id="filePreview"></div>
            </div>
            <span class="hint-text">Enter to send · Shift+Enter for new line</span>
        </div>
    </div>
</div>

<script>
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:8000'
    : 'https://doculens-zepw.onrender.com';

let uploadedSource = null;
let pendingFiles = [];
let isLoading = false;

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        askQuestion();
    }
}

function useHint(el) {
    document.getElementById('question').value = el.textContent;
    autoResize(document.getElementById('question'));
    document.getElementById('question').focus();
}

// ── Upload via header pill ──
async function handleHeaderUpload(input) {
    const files = Array.from(input.files);
    if (!files.length) return;
    await doUpload(files);
}

// ── Upload via attach button ──
function handleAttachUpload(input) {
    const files = Array.from(input.files);
    if (!files.length) return;
    pendingFiles = files;
    renderFileChips();
}

function renderFileChips() {
    const preview = document.getElementById('filePreview');
    preview.innerHTML = '';
    pendingFiles.forEach((f, i) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${f.name}<span class="remove" onclick="removeFile(${i})">✕</span>`;
        preview.appendChild(chip);
    });
}

function removeFile(i) {
    pendingFiles.splice(i, 1);
    renderFileChips();
}

async function doUpload(files) {
    const badge = document.getElementById('uploadBadge');
    const badgeText = document.getElementById('uploadBadgeText');
    badge.classList.remove('visible');

    // Show uploading state in pill
    document.getElementById('headerUploadPill').innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Uploading…`;

    try {
        for (const file of files) {
            const fd = new FormData();
            fd.append('file', file);
            await fetch(`${API_BASE}/upload`, { method: 'POST', body: fd });
        }
        uploadedSource = files.length === 1 ? files[0].name : null;
        badgeText.textContent = files.length === 1 ? files[0].name : `${files.length} files loaded`;
        badge.classList.add('visible');
    } catch (e) {
        showError('Upload failed. Make sure the backend is running.');
    }

    // Reset pill
    document.getElementById('headerUploadPill').innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload PDF
        <input type="file" id="headerFileInput" accept=".pdf" multiple onchange="handleHeaderUpload(this)">`;
}

function showError(msg) {
    const t = document.getElementById('errorToast');
    t.textContent = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 4000);
}

function appendMessage(role, content) {
    document.getElementById('welcome')?.remove();

    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const initial = role === 'user' ? 'You' : '✦';
    row.innerHTML = `
        <div class="message-inner">
            <div class="avatar ${role}">${initial}</div>
            <div class="message-content">
                <div class="message-text">${content}</div>
            </div>
        </div>`;

    document.getElementById('chatArea').appendChild(row);
    row.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return row.querySelector('.message-text');
}

function appendThinking() {
    document.getElementById('welcome')?.remove();

    const row = document.createElement('div');
    row.className = 'message-row assistant';
    row.id = 'thinkingRow';
    row.innerHTML = `
        <div class="message-inner">
            <div class="avatar assistant">✦</div>
            <div class="message-content">
                <div class="message-text thinking">
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
            </div>
        </div>`;
    document.getElementById('chatArea').appendChild(row);
    row.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function askQuestion() {
    if (isLoading) return;

    // If files pending in attach, upload first
    if (pendingFiles.length) {
        await doUpload(pendingFiles);
        pendingFiles = [];
        document.getElementById('filePreview').innerHTML = '';
    }

    const textarea = document.getElementById('question');
    const question = textarea.value.trim();
    if (!question) return;

    textarea.value = '';
    autoResize(textarea);
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('errorToast').classList.remove('visible');

    appendMessage('user', escapeHtml(question));
    appendThinking();

    try {
        const res = await fetch(`${API_BASE}/ask`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, source: uploadedSource })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById('thinkingRow')?.remove();

        const row = document.createElement('div');
        row.className = 'message-row assistant';

        const sourcesHtml = data.sources && data.sources.length
            ? `<div class="sources-section">
                <div class="sources-label">Sources</div>
                <div class="source-tags">${data.sources.map(s =>
                    `<span class="source-tag"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${escapeHtml(s)}</span>`
                ).join('')}</div>
               </div>`
            : '';

        row.innerHTML = `
            <div class="message-inner">
                <div class="avatar assistant">✦</div>
                <div class="message-content">
                    <div class="message-text">${escapeHtml(data.answer)}</div>
                    ${sourcesHtml}
                    <div class="score-text">Confidence: ${data.top_score}</div>
                </div>
            </div>`;

        document.getElementById('chatArea').appendChild(row);
        row.scrollIntoView({ behavior: 'smooth', block: 'end' });

    } catch (e) {
        document.getElementById('thinkingRow')?.remove();
        showError('Error connecting to the API. Please try again.');
    } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
    }
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
